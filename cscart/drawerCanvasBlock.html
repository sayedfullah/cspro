<style>
    /* Drawer styles */
    #custom-right-drawer {
        position: fixed;
        top: 200px;
        right: -440px;
        width: 450px;
        height: calc(100% - 200px);
        background: #fff;
        border-left: 1px solid #ddd;
        box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
        transition: right 0.3s ease;
        z-index: 9999;
    }

    #custom-right-drawer.open {
        right: 0;
    }

    .drawer-toggle {
        position: absolute;
        top: 10px;
        left: -30px;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border: 1px solid #ddd;
        border-right: none;
        box-shadow: -1px 0 3px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        z-index: 10001;
    }

    .chevron {
        transform: rotate(0deg);
        transition: transform 0.3s ease;
    }

    #custom-right-drawer.open .chevron {
        transform: rotate(180deg);
    }

    .drawer-content {
        padding: 20px;
        overflow-y: auto;
        height: 100%;
        display: flex;
        flex-direction: column;

    }

    /* Mobile adjustments */
    @media (max-width: 1280px),
    (pointer: coarse) and (hover: none) {
        #custom-right-drawer {
            width: 90vw;
            max-width: 450px;
            right: -90vw;
        }

        #custom-right-drawer.open {
            right: 0;
        }

        .drawer-toggle {
            left: -30px;
        }
    }

    /* Carousel styles */
    .icon-carousel-wrapper {
        display: flex;
        align-items: center;
        gap: 5px;
        max-width: 200px;
        overflow: hidden;
        margin: 10px 0;
    }

    .icon-carousel {
        overflow: hidden;
        flex: 1;
    }

    .icon-carousel ul {
        display: flex;
        transition: transform 0.3s ease;
        padding: 0;
        margin: 0;
        list-style: none;
    }

    .icon-carousel li {
        flex: 0 0 auto;
        padding: 2px;
    }

    .icon-carousel img {
        width: 20px;
        height: 20px;
        object-fit: contain;
    }

    .nav {
        background: #f1f1f1;
        border: none;
        padding: 4px 8px;
        cursor: pointer;
        font-weight: bold;
        border-radius: 4px;
    }

    .nav:hover {
        background: #ddd;
    }

    /* Canvas Control styles */
    @font-face {
        font-family: 'z_hero';
        src: url('/images/prism/fonts/z_hero.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'z_corsiva';
        src: url('/images/prism/fonts/z_corsiva.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'z_boli';
        src: url('/images/prism/fonts/z_boli.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'z_swan';
        src: url('/images/prism/fonts/z_swan.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'z_english';
        src: url('/images/prism/fonts/z_english.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'z_chaparrals';
        src: url('/images/prism/fonts/z_chaparrals.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }

    @keyframes pulse {

        0%,
        100% {
            opacity: 1;
        }

        50% {
            opacity: 0.5;
        }
    }

    .canvasBtn,
    .fontBtn {
        width: 35px;
        height: 35px;
        transition: all 0.3s ease-in-out;
    }
</style>
