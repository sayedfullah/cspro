<!-- main container start -->
<div id="mainContainer" style="display:flex;flex-direction:column;width:300px;max-width:450px">
    <div id="svgHost" style="border: 1px solid #dee2e6;border-radius:5px;max-width:450px;width:100%">

        <canvas id="canvas" style="border: 1px solid #dee2e6;width:300px;height:300px">canvas not supported</canvas>
    </div>

    <div style="border:1px solid #dee2e6;border-radius:5px;width:440px;padding:5px">
        <div style="display: flex; flex-direction: row;justify-content:space-evenly;width:100%">
            <button class="canvasBtn"
                style="border: 1px solid #6c757d; background: transparent; color: #6c757d; padding: 2px 8px; font-size: 0.875rem; margin: 4px; border-radius: 4px;width:50px">
                &lt;
            </button>
            <button class="canvasBtn"
                style="border: 1px solid #6c757d; background: transparent; color: #6c757d; padding: 2px 8px; font-size: 0.875rem; margin: 4px; border-radius: 4px;width:50px">&gt;</button>
            <button class="canvasBtn"
                style="border: 1px solid #6c757d; background: transparent; color: #6c757d; padding: 2px 8px; font-size: 0.875rem; margin: 4px; border-radius: 4px;width:50px">
                Text
            </button>

            <button id="_heart"
                style="border: 1px solid #6c757d; background: transparent; color: #6c757d; padding: 2px 8px; font-size: 0.875rem; margin: 4px; border-radius: 4px;width:50px">♥</button>
            <button id="_order" class="fileBtn"
                style="border: 1px solid #6c757d; background: transparent; color: #6c746d; padding: 2px 8px; font-size: 0.875rem; margin: 4px; border-radius: 4px;">
                svg
            </button>
            <button id="_share" class="fileBtn"
                style="border: 1px solid #6c757d; background: transparent; color: #6c346d; padding: 2px 8px; font-size: 0.875rem; margin: 4px; border-radius: 4px;">
                image
            </button>
        </div>
        <div style="display: flex; flex-direction: row;width:430px;margin-top:5px">
            <input type="file"
                style="display: block; border: 1px solid black; border-radius:0.25rem; padding:0.25rem;width:100%"
                name="file" id="_imageFile">
        </div>
    </div>
</div>
<!-- main container end -->
