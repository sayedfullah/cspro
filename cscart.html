        @font-face {

            font-weight: normal;

            font-weight: normal;

        }

        @font-face {
            font-family: 'z_swan';
            src: url('https://oroblob.blob.core.windows.net/cspro/fonts/z_swan.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        .font-boli {
            font-family: 'z_boli', sans-serif;
        }

        .font-chaparrals {
            font-family: 'z_chaparrals', serif;
        }

        .font-corsiva {
            font-family: 'z_corsiva', cursive;
        }

        .font-english {
            font-family: 'z_english', serif;
        }

        .font-swan {
            font-family: 'z_swan', sans-serif;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* side pane */
        .toggle-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            background: #333;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
            z-index: 1000;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: #fafafa;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            transition: right 1s ease;
            z-index: 999;
        }

        .drawer.open {
            right: 0;
        }

        .close-btn {
            /* position: absolute;
            top: 1rem;
            right: 1rem; */
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Carousel styles */
        .icon-carousel-wrapper {
            position: relative;
            max-width: 250px;
            padding: 0 30px;
            /* Make room for nav buttons */
        }

        .icon-carousel {
            overflow: hidden;
            width: 100%;
        }

        .icon-carousel ul {
            display: flex;
            transition: transform 0.3s ease;
            padding: 0;
            margin: 0;
            list-style: none;
            width: max-content;
        }

        .icon-carousel li {
            flex: 0 0 auto;
            margin: 0 2px;
        }

        .icon-carousel img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            display: block;
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            /*  background: #f1f1f1; 
            font-weight: bold;
           border-radius: 4px; */
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            z-index: 2;
        }

        .nav.left {
            left: 0;
        }

        .nav.right {
            right: 0;
        }

        .nav:hover {
            font-weight: bold;
            color: gray;
        }
    </style>

            <script>

                });
            </script>

            <script>
                // Array of font URLs
                const fontUrls = [
                    'https://oroblob.blob.core.windows.net/cspro/fonts/z_boli.woff2',
                    'https://oroblob.blob.core.windows.net/cspro/fonts/z_chaparrals.woff2',
                    'https://oroblob.blob.core.windows.net/cspro/fonts/z_corsiva.woff2',
                    'https://oroblob.blob.core.windows.net/cspro/fonts/z_english.woff2',
                    'https://oroblob.blob.core.windows.net/cspro/fonts/z_swan.woff2'
                ];

                // Font names corresponding to the URLs
                const fontNames = [
                    'z_boli',
                    'z_chaparrals',
                    'z_corsiva',
                    'z_english',
                    'z_swan'
                ];

                // Function to load fonts
                function loadFonts() {
                    const fontFaces = fontUrls.map((url, index) => {
                        return new FontFace(fontNames[index], `url(${url})`);
                    });
                    // Add fonts to document
                    fontFaces.forEach(fontFace => {
                        fontFace.load().then(loadedFace => {
                            document.fonts.add(loadedFace);
                        }).catch(error => {
                            console.error(`Error loading font ${fontFace.family}:`, error);
                        });
                    });
                }
                loadFonts();
            </script>

            <script>
                $(document).ready(function () {
                    let currentIndex = 0;
                    const visibleIcons = 5;
                    const $carousel = $('.icon-carousel ul');
                    const $items = $('.icon-carousel li');
                    const itemWidth = $items.outerWidth(true);
                    const totalItems = $items.length;

                    $('.nav.right').click(function () {
                        if (currentIndex < totalItems - visibleIcons) {
                            currentIndex++;
                            $carousel.css('transform', `translateX(${-itemWidth * currentIndex}px)`);
                        }
                    });

                    $('.nav.left').click(function () {
                        if (currentIndex > 0) {
                            currentIndex--;
                            $carousel.css('transform', `translateX(${-itemWidth * currentIndex}px)`);
                        }
                    });
                });
            </script>
