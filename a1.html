<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Elegant Canvas Creator</title>
    <style>
        body {
            background-color: #f4f4f6;
        }
        .nav-btn {
            transition: all 0.3s ease;
            opacity: 0.7;
        }
        .nav-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .slide-nav {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-xl bg-white shadow-2xl rounded-2xl overflow-hidden">
        <div class="relative">
            <canvas id="canvas" class="w-full aspect-square bg-gray-100" width="450" height="450"></canvas>
            
            <div class="absolute top-4 left-4 right-4 flex justify-between">
                <div class="slide-nav rounded-full p-2 flex space-x-2 shadow-md">
                    <button class="nav-btn p-2 rounded-full hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <button class="nav-btn p-2 rounded-full hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
                <div class="slide-nav rounded-full p-2 shadow-md">
                    <button class="nav-btn">♥</button>
                </div>
            </div>
        </div>
        
        <div class="p-4 space-y-4">
            <div class="flex justify-center space-x-3">
                <button class="nav-btn">
                    <img src="https://oroblob.blob.core.windows.net/cspro/images/AG.png" class="w-10 h-10 rounded-full" alt="ag" />
                </button>
                <button class="nav-btn">
                    <img src="https://oroblob.blob.core.windows.net/cspro/images/9Y.png" class="w-10 h-10 rounded-full" alt="9y" />
                </button>
                <button class="nav-btn">
                    <img src="https://oroblob.blob.core.windows.net/cspro/images/9R.png" class="w-10 h-10 rounded-full" alt="9r" />
                </button>
            </div>
            
            <div class="flex justify-center space-x-2">
                <button class="nav-btn">
                    <img src="https://oroblob.blob.core.windows.net/cspro/images/z_corsiva.png" class="w-10 h-10 rounded-full" alt="corsiva" />
                </button>
                <button class="nav-btn">
                    <img src="https://oroblob.blob.core.windows.net/cspro/images/z_boli.png" class="w-10 h-10 rounded-full" alt="boli" />
                </button>
                <button class="nav-btn">
                    <img src="https://oroblob.blob.core.windows.net/cspro/images/z_swan.png" class="w-10 h-10 rounded-full" alt="swan" />
                </button>
            </div>
            
            <div class="flex justify-center space-x-3">
                <label class="bg-blue-500 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-blue-600 transition">
                    Upload Image
                    <input type="file" class="hidden" />
                </label>
                <button class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                    Create SVG
                </button>
                <button class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                    Download
                </button>
            </div>
        </div>
    </div>
</body>
</html>
